# Publishes docs/ to the gh-pages branch, which GitHub Pages serves (SIG's workflow, verbatim).
# OWNER: Agent A (core engine).
#
# Two ways to serve the site; pick ONE in Settings → Pages:
#   a) Deploy from a branch → gh-pages → / (root)   ← this workflow keeps gh-pages in sync
#   b) Deploy from a branch → main → /docs          ← works too: docs/ is committed on main
# Either way the site lives at https://fritzhand.github.io/cincy-week/ (pathPrefix /cincy-week/).
name: Publish site to gh-pages

on:
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push docs/ as the gh-pages root
        run: |
          TREE=$(git rev-parse HEAD:docs)
          COMMIT=$(git -c user.name="github-actions[bot]" \
                       -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                       commit-tree "$TREE" -m "Deploy site (docs/ from $GITHUB_SHA)")
          git push --force origin "$COMMIT":refs/heads/gh-pages
